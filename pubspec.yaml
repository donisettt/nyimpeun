name: nyimpeun
description: "Nyimpeun - Aplikasi Tracking Keuangan Personal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # Network
  dio: ^5.7.0
  supabase_flutter: ^2.8.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0

  # Utils
  equatable: ^2.0.5
  intl: ^0.19.0
  flutter_native_splash: ^2.4.8
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/home/
    - assets/images/wallet/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic

flutter_native_splash:
  color: "#1E3A8A"
  image: "assets/images/logo_nyimpeun.png"
  android_12:
    color: "#1E3A8A"
    image: "assets/images/logo_nyimpeun.png"
  image_dark: "assets/images/logo_nyimpeun.png"
  color_dark: "#1E3A8A"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_nyimpeun.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_nyimpeun.png"
  min_sdk_android: 21
